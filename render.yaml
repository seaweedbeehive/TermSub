services:
  - type: web
    name: termsub-web
    runtime: docker
    repo: https://github.com/seaweedbeehive/TermSub
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: termsub-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://termsub.eedbee.app

databases:
  - name: termsub-db
    plan: free
    databaseName: termsub
    postgresMajorVersion: "15"

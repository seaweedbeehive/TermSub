services:
  - type: web
    name: termsub-web
    runtime: docker
    repo: https://github.com/seaweedbeehive/TermSub
    plan: free
    dockerfilePath: Dockerfile
    dockerCommand: sh start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: termsub-db
          property: connectionString
      - key: REDIS_URL
        sync: false  # You'll set this manually after creating Redis
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: hello@termsub.eedbee.app
      - key: FRONTEND_BASE_URL
        value: https://www.termsub.eedbee.app

databases:
  - name: termsub-db
    plan: free
    databaseName: termsub
    postgresMajorVersion: "15"
